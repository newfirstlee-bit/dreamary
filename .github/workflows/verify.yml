name: Verify
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install locked dependencies
        run: npm ci
      - name: Check regression cases
        run: npm run test:regression
      - name: Check types
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Build app with demo configuration
        run: npm run build:app:test
      - name: Check Firestore rules and backup restore in demo emulator
        run: npx --yes firebase-tools@15.27.0 emulators:exec --only firestore --project demo-dreamary-security --config firebase.test.json 'npm run test:emulator'
