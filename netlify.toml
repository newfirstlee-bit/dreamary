[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "22"
  AWS_LAMBDA_JS_RUNTIME = "nodejs22.x"
  NODE_OPTIONS = "--experimental-require-module"
  SECRETS_SCAN_OMIT_PATHS = ".netlify,.next/static,**/*.pack,android/**,ios/**"

[functions]
  node_bundler = "nft"
